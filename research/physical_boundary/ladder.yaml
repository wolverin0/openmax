  - id: "PB-001"
    title: "Metric width-fix and paired-gatekeeper null-replay validation"
    hypothesis: "Enforcing explicit channel_width_mhz in {5, 10, 20, 40, 80} and paired A/B/A/B block permutation inference eliminates the 40 MHz normalization bias and bounds A/A false positives to <= alpha (0.05)."
    branch_unlocked: "Unlocks all quantitative bench experiments (PB-020..PB-070) and autonomous safe policy search (PB-060)."
    branch_killed: "Kills unpaired 2-sample t-test promotion and hard-coded 40 MHz goodput_per_mhz scoring."

    branch_unlocked: "Unlocks ADCCAPTURE/GENWAVEFORM/PHYDBGDUMP qualification (PB-023), 5/10 MHz cabled loop (PB-030), and LDPC/BCC/STBC/SGI matrix (PB-031)."

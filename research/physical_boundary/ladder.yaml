      - "paired_bootstrap_ci_width_pct"
    acceptance_criteria: "Zero silent 40 MHz fallback on missing width; A/A null replay false-positive rate <= 0.05 across >= 300 Monte Carlo trials; lexicographic p99 -> p95 -> fairness -> goodput_per_mhz enforced."
    falsification_criteria: "A/A null replay produces > 5% false-positive promotions or any sample without explicit/metadata width computes a biased goodput_per_mhz."
    rollback_condition: "Revert gatekeeper changes if existing deterministic test suite regresses."
